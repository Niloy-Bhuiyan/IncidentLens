name: Bug report
description: Report a reproducible IncidentLens defect
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and environment
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe logs, request IDs, or screenshots
      description: Remove secrets and private source content before submission.

