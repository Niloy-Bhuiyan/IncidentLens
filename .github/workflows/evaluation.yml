name: Retrieval evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/app/ingestion/**"
      - "backend/app/retrieval/**"
      - "backend/app/graph/**"
      - "demo/**"
      - "evaluation/**"

permissions:
  contents: read

jobs:
  deterministic-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e "backend[dev]"
      - run: python -m backend.app.evaluation.runner
      - run: python scripts/ci/verify_benchmark.py
      - uses: actions/upload-artifact@v7
        with:
          name: incidentlens-evaluation
          path: evaluation/results/latest.json

